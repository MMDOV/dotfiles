set -g set-titles on
set -g set-titles-string '#T'
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",foot:RGB"
set -as terminal-features ",foot-direct:RGB"
set -s escape-time 0
set -gq allow-passthrough on
set -g visual-activity off
set -g mouse on

# Colors come from the active look (see dotfiles/config/look).
source-file -q ~/.config/tmux/look.conf

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

bind r source-file $HOME/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
set -s set-clipboard off
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r r run-shell "$DOTFILES_ROOT/tmux/scripts/open-ai-resume-window.sh \"#{pane_current_path}\""
bind-key -r f run-shell "tmux neww $HOME/.local/bin/tmux-sessionizer"
bind-key -r u run-shell "$HOME/.local/bin/tmux-sessionizer $HOME"
bind-key -r p run-shell "$HOME/.local/bin/tmux-sessionizer $DOTFILES_ROOT"
bind-key -T copy-mode-vi 'R' send-keys -X copy-pipe-and-cancel "wl-copy && $DOTFILES_ROOT/scripts/helpers/popup_rtl.sh"
bind-key C run-shell "cd \"#{pane_current_path}\" && $DOTFILES_ROOT/tmux/scripts/new-claude-tab.sh"
bind-key X run-shell "cd \"#{pane_current_path}\" && $DOTFILES_ROOT/tmux/scripts/new-ai-tab.sh codex"

bind-key & confirm-before -p "kill-window #W? (y/n)" "run-shell \"$DOTFILES_ROOT/tmux/scripts/kill-ai-window.sh #{session_name} #{window_id}\""
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
run '$HOME/.tmux/plugins/tpm/tpm'
