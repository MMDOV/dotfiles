# The look this setup shipped with. Colors come from what kitty, konsole, tmux,
# waybar and hyprlock each used separately, merged into one palette.
name = "tokyo"
appearance = "dark"

[colors]
bg         = "#1a1b26"
bg_alt     = "#16161e"
surface    = "#292e42"
border     = "#3b4261"
fg         = "#c0caf5"
fg_dim     = "#a9b1d6"
fg_faint   = "#565f89"
accent     = "#7aa2f7"
accent_alt = "#7dcfff"
ok         = "#9ece6a"
warn       = "#e0af68"
danger     = "#f7768e"
selection  = "#33467c"

t0  = "#15161e"
t1  = "#f7768e"
t2  = "#9ece6a"
t3  = "#e0af68"
t4  = "#7aa2f7"
t5  = "#bb9af7"
t6  = "#7dcfff"
t7  = "#a9b1d6"
t8  = "#414868"
t9  = "#f7768e"
t10 = "#9ece6a"
t11 = "#e0af68"
t12 = "#7aa2f7"
t13 = "#bb9af7"
t14 = "#7dcfff"
t15 = "#c0caf5"

# Per-app tweaks this setup already had: a bluer bar, cyan lock ring and borders.
bar_bg            = "#161a2d"
bar_accent        = "#33ccff"
lock_accent       = "#33ccff"
border_active     = "#589ed7"
border_active_alt = "#0db9d7"
border_inactive   = "#595959"
