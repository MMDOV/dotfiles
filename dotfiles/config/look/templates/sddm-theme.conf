# Generated by `look`. Do not edit; change the look instead.
[General]
# Password mask character
passwordCharacter=●
# Mask password characters or not ("true" or "false")
passwordMask=true
# value "1" is all display width, "0.5" is a half of display width etc.
passwordInputWidth=0.20

# Same entry box as the lock screen: faint fill, accent border
passwordInputBackground={{surface|argb=40}}
passwordInputBorderWidth=4
passwordInputBorderColor={{lock_accent}}
passwordInputRadius=1
# "true" for visible cursor, "false" for invisible
passwordInputCursorVisible=false
# Font size of password (in points)
passwordFontSize=36
passwordTextColor={{fg}}

# The current wallpaper, copied here by `look`
background=background
backgroundFillMode=fill

# Default text color for all labels
basicTextColor={{fg}}

# Radius of background blur
blurRadius=100
