# Generated by `look`. Do not edit; change the look instead.
set -g mode-style "fg={{accent}},bg={{border}}"

set -g message-style "fg={{accent}},bg={{border}}"
set -g message-command-style "fg={{accent}},bg={{border}}"

set -g pane-border-style "fg={{border}}"
set -g pane-active-border-style "fg={{accent}}"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg={{accent}},bg={{bg_alt}}"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg={{bg_alt}},bg={{accent}},bold] #S #[fg={{accent}},bg={{bg_alt}},nobold,nounderscore,noitalics]"
set -g status-right "#[fg={{bg_alt}},bg={{bg_alt}},nobold,nounderscore,noitalics]#[fg={{accent}},bg={{bg_alt}}] #{prefix_highlight} #[fg={{border}},bg={{bg_alt}},nobold,nounderscore,noitalics]#[fg={{accent}},bg={{border}}] %Y-%m-%d  %I:%M %p #[fg={{accent}},bg={{border}},nobold,nounderscore,noitalics]#[fg={{bg_alt}},bg={{accent}},bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg={{bg_alt}},bg={{bg_alt}},nobold,nounderscore,noitalics]#[fg={{accent}},bg={{bg_alt}}] #{prefix_highlight} #[fg={{border}},bg={{bg_alt}},nobold,nounderscore,noitalics]#[fg={{accent}},bg={{border}}] %Y-%m-%d  %H:%M #[fg={{accent}},bg={{border}},nobold,nounderscore,noitalics]#[fg={{bg_alt}},bg={{accent}},bold] #h "
}

setw -g window-status-activity-style "underscore,fg={{fg_dim}},bg={{bg_alt}}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg={{fg_dim}},bg={{bg_alt}}"
setw -g window-status-format "#[fg={{bg_alt}},bg={{bg_alt}},nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg={{bg_alt}},bg={{bg_alt}},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg={{bg_alt}},bg={{border}},nobold,nounderscore,noitalics]#[fg={{accent}},bg={{border}},bold] #I  #W #F #[fg={{border}},bg={{bg_alt}},nobold,nounderscore,noitalics]"

set -g @prefix_highlight_output_prefix "#[fg={{warn}}]#[bg={{bg_alt}}]#[fg={{bg_alt}}]#[bg={{warn}}]"
set -g @prefix_highlight_output_suffix ""
