# Use aria2c for HTTP/FTP source downloads (parallel, resumable).
#
# Deployed to /etc/makepkg.conf.d/ rather than replacing /etc/makepkg.conf.
# The full file is distro-owned: on CachyOS it carries x86-64-v3/v4 compiler
# tuning that a wholesale overwrite would silently discard, and on Arch it is
# stock boilerplate not worth tracking. This drop-in is the only part that is
# actually ours.
#
# Requires: aria2

DLAGENTS=('file::/usr/bin/curl -gqC - -o %o %u'
  'ftp::/usr/bin/aria2c -U "%A" -s4 -x4 -k5M %u -o %o'
  'http::/usr/bin/aria2c -U "%A" -s4 -x4 -k5M %u -o %o'
  'https::/usr/bin/aria2c -U "%A" -s4 -x4 -k5M %u -o %o'
  'rsync::/usr/bin/rsync --no-motd -z %u %o'
  'scp::/usr/bin/scp -C %u %o')
